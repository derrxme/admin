<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - BPM FPIK UBT</title>
    <link rel="stylesheet" href="asset/style.css">
    <link rel="stylesheet" href="asset/bg-about.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="asset/image-asset/logo-bpm.png">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        .login-container {
            max-width: 420px;
            margin: 80px auto;
            background: white;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .login-container h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }
        .login-container .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(244,185,66,0.2);
        }
        .btn-login {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background: #0a3a62;
            transform: translateY(-2px);
        }
        .btn-login:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }
        footer {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 60px;
        }
        .logo-icon-login {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0 auto 20px;
            border: 3px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .logo-icon-login img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @media (max-width: 480px) {
            .login-container {
                margin: 40px 20px;
                padding: 30px 25px;
            }
            .login-container h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-logo">
        <div class="logo-icon">
            <img src="asset/image-asset/logo-bpm.png" alt="Logo BPM">
        </div>
        <h1>BPM FPIK UBT</h1>
    </div>
    <div class="nav-menu">
        <a href="https://webhostingmhs-stack.github.io/bpm-22/index.html">Beranda</a>
        <a href="https://webhostingmhs-stack.github.io/bpm-22/html/about.html">Tentang</a>
        <a href="https://webhostingmhs-stack.github.io/bpm-22/html/dashboard/dashboard.html">Dashboard</a>
    </div>
</nav>

<section style="padding: 40px 8%;">
    <div class="login-container">
        <div class="logo-icon-login">
            <img src="asset/image-asset/logo-bpm.png" alt="Logo BPM">
        </div>
        <h2>Admin Panel</h2>
        <p class="subtitle">Masukkan kredensial untuk mengakses dashboard admin</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn-login" id="submitBtn">Login</button>
        </form>
    </div>
</section>

<footer>
    <p>© 2026 BPM FPIK UBT</p>
    <p style="font-size: 0.7rem; margin-top: 5px;">Admin Login Page</p>
</footer>

<!-- SweetAlert2 JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // ============= KONFIGURASI HARDCODE =============
    const VALID_USERNAME = 'bpmadmin';
    const VALID_PASSWORD = 'bpm2026';
    
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        
        if (!username || !password) {
            await Swal.fire({
                icon: 'warning',
                title: 'Field Kosong',
                text: 'Harap isi username dan password!',
                confirmButtonColor: '#0F4C81',
                confirmButtonText: 'OK',
                background: '#fff',
                backdrop: true
            });
            return;
        }
        
        // Disable button saat proses
        submitBtn.disabled = true;
        submitBtn.textContent = 'Memproses...';
        
        // Simulasi delay
        setTimeout(async () => {
            if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                // Simpan session di localStorage
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminLoginTime', new Date().getTime());
                localStorage.setItem('adminUsername', username);
                
                await Swal.fire({
                    icon: 'success',
                    title: 'Login Berhasil!',
                    text: 'Selamat datang, Administrator BPM FPIK UBT',
                    confirmButtonColor: '#0F4C81',
                    confirmButtonText: 'Masuk Dashboard',
                    timer: 2000,
                    timerProgressBar: true,
                    background: '#fff',
                    backdrop: true
                });
                
                // Redirect ke admin dashboard
                window.location.href = 'index.html';
            } else {
                await Swal.fire({
                    icon: 'error',
                    title: 'Login Gagal!',
                    text: 'Username atau password yang Anda masukkan salah.',
                    confirmButtonColor: '#0F4C81',
                    confirmButtonText: 'Coba Lagi',
                    background: '#fff',
                    backdrop: true
                });
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }, 500);
    });
</script>
</body>
</html>
